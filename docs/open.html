<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultSync Recovery Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #1C1C1E;
            border: 1px solid #2C2C2E;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
        }
        .icon {
            font-size: 52px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #8E8E93;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #0A84FF;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 12px;
        }
        .btn:active { background: #0070DF; }
        .btn-secondary {
            background: #2C2C2E;
            color: #0A84FF;
        }
        .hint {
            font-size: 12px;
            color: #636366;
            margin-top: 16px;
        }
    </style>
    <script>
        function launchVaultSync() {
            // 1. Try Chrome Android Intent URI first
            window.location.href = "intent://open#Intent;scheme=vaultsync;package=com.vaultsync.app;end";
            
            // 2. Fallback to custom scheme
            setTimeout(function() {
                window.location.href = "vaultsync://open";
            }, 600);
        }

        window.onload = function() {
            // Attempt auto-launch on page load
            launchVaultSync();
        };
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">🔓</div>
        <h1>VaultSync Recovery</h1>
        <p>Launching your private vault. If your app does not open automatically, tap the button below.</p>
        <button class="btn" onclick="launchVaultSync()">Open VaultSync App</button>
        <a class="btn btn-secondary" href="vaultsync://open">Direct Scheme Link</a>
        <div class="hint">Compatible with Chrome, Samsung Internet, Edge, Firefox, and Brave on Android.</div>
    </div>
</body>
</html>
